<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AlPytide Studio</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

  <script src="/socket.io/socket.io.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
    }

    .CodeMirror, #terminal {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    body {
      background-color: #181a1f;
      color: #abb2bf;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 6px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .brand-title {
      font-size: 0.65rem;
      color: #5c6370;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .tab-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .tab-pane {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .tab-pane.active {
      display: flex;
    }

    .CodeMirror {
      height: 100% !important;
      font-family: "Fira Code", monospace, "Courier New";
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #282c34;
      transition: border-color 0.3s ease;
    }

    .CodeMirror-focused {
      border-color: #58a6ff !important;
      box-shadow: 0 0 8px rgba(88, 166, 255, 0.2);
    }

    /* Khung Console Output với hiệu ứng viền sáng nhẹ */
    .console-container {
      flex-grow: 1;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.3s ease;
    }

    .console-container:focus-within {
      border-color: #3fb950;
      box-shadow: 0 0 10px rgba(63, 185, 80, 0.15);
    }

    .console-wrapper {
      flex-grow: 1;
      color: #3fb950;
      padding: 10px;
      font-family: "Fira Code", monospace;
      font-size: 13px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 0;
      padding-bottom: 70px;
    }

    /* Popup hiển thị đầy đủ tiêu đề input với hiệu ứng mượt mà */
    .prompt-popup {
      display: none;
      position: absolute;
      bottom: 65px;
      left: 10px;
      right: 10px;
      background-color: #161b22;
      border: 1px solid #58a6ff;
      color: #58a6ff;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      font-family: "Fira Code", monospace;
      z-index: 20;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      word-break: break-all;
      opacity: 0;
      transform: translateY(10px) scale(0.95);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .prompt-popup.show {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Thanh Input bám đáy có hiệu ứng trượt lên */
    .floating-input-bar {
      display: none;
      background-color: #161b22;
      border-top: 1px solid #30363d;
      padding: 8px 12px;
      align-items: center;
      gap: 8px;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
      flex-shrink: 0;
      position: relative;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
    }

    .floating-input-bar.show {
      display: flex;
      transform: translateY(0);
    }

    .floating-input-bar .label-container {
      max-width: 110px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
      color: #58a6ff;
      cursor: pointer;
      flex-shrink: 0;
      padding: 2px 4px;
      border-radius: 4px;
      background: rgba(88, 166, 255, 0.1);
      transition: background 0.2s;
    }

    .floating-input-bar .label-container:active {
      background: rgba(88, 166, 255, 0.3);
    }

    .floating-input-bar input {
      flex-grow: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 4px;
      font-family: "Fira Code", monospace;
      font-size: 13px;
      outline: none;
      caret-color: #3fb950;
      min-width: 0;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .floating-input-bar input:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
    }

    /* Hiệu ứng xung nhịp Neon cho nút Run */
    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0 0 rgba(13, 110, 253, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(13, 110, 253, 0); }
      100% { box-shadow: 0 0 0 0 rgba(13, 110, 253, 0); }
    }

    #runBtn {
      animation: pulse-glow 2s infinite;
    }

    /* Spinner Loading với hiệu ứng chuyển màu mượt */
    .loading-overlay {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #58a6ff;
      z-index: 10;
      background: rgba(13, 17, 23, 0.85);
      width: 100%;
      height: 100%;
      backdrop-filter: blur(2px);
    }

    .nav-tabs .nav-link {
      color: #8b949e;
      border: none;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.2s, background-color 0.2s;
    }

    .nav-tabs .nav-link.active {
      background-color: #21262d;
      color: #58a6ff;
      border-bottom: 2px solid #58a6ff;
    }

    .btn-action {
      height: 30px;
      min-width: 32px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: transform 0.15s ease, background-color 0.2s, filter 0.2s;
    }

    .btn-action:active {
      transform: scale(0.90);
    }

    .btn-action:hover {
      filter: brightness(1.15);
    }
  </style>
</head>
<body>

  <div class="brand-title text-center mb-1">ALPYTIDE STUDIO (PYTHON ENGINE)</div>

  <div class="top-bar">
    <ul class="nav nav-tabs border-0" id="ideTabs">
      <li class="nav-item">
        <button class="nav-link active" id="edit-tab" onclick="switchTab('edit')">main.py</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="output-tab" onclick="switchTab('output')">Output</button>
      </li>
    </ul>

    <div class="d-flex align-items-center gap-1">
      <button class="btn btn-primary btn-action fw-bold" id="runBtn" onclick="runPythonCode()">
        <i class="fa-solid fa-play me-1"></i>Run
      </button>
      <button class="btn btn-outline-secondary btn-action" onclick="copyCode()" title="Sao chép Code">
        <i class="fa-regular fa-copy"></i>
      </button>
      <button class="btn btn-outline-secondary btn-action" onclick="copyLog()" title="Sao chép Console Output">
        <i class="fa-solid fa-terminal"></i>
      </button>
      <button class="btn btn-outline-secondary btn-action" onclick="clearOutput()" title="Xóa màn hình Output">
        <i class="fa-solid fa-broom"></i>
      </button>
      <button class="btn btn-outline-danger btn-action" onclick="clearCode()" title="Xóa tất cả code">
        <i class="fa-solid fa-trash-can"></i>
      </button>
    </div>
  </div>

  <div class="tab-content" id="ideTabContent">
    <div class="tab-pane fade show active" id="edit-pane">
      <textarea id="codeEditor" lang="vi" autocapitalize="none" autocorrect="off" spellcheck="false"></textarea>
    </div>

    <div class="tab-pane fade" id="output-pane">
      <div class="console-container">
        <!-- Spinner Loading -->
        <div class="loading-overlay" id="loadingOverlay">
          <div class="spinner-border text-primary" role="status"></div>
          <span style="font-size: 12px; font-weight: 500;" id="loadingText">Đang khởi chạy Python Engine...</span>
        </div>

        <div class="console-wrapper" id="terminal">
          <div id="terminalText">> Đang kết nối tới Server Python...\n</div>
        </div>

        <!-- Popup hiệu ứng mượt hiển thị đầy đủ tiêu đề -->
        <div class="prompt-popup" id="promptPopup" onclick="togglePopup()">
          <span id="popupText"></span>
          <div style="font-size: 10px; color: #8b949e; margin-top: 6px; text-align: right;">(Chạm để đóng)</div>
        </div>

        <!-- Thanh Input bám đáy có hiệu ứng trượt -->
        <div class="floating-input-bar" id="floatingInputBar">
          <div class="label-container" id="inputPromptLabel" onclick="togglePopup()" title="Chạm để xem đầy đủ">Nhập:</div>
          <input type="text" id="terminalInput" lang="vi" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="Nhập giá trị...">
          <button class="btn btn-sm btn-success fw-bold px-3" onclick="sendInput()" style="height: 30px; font-size: 12px; flex-shrink: 0;">Gửi</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

  <script>
    const socket = io();

    const defaultCode = `import time\n\nwhile True:\n    print("=== MÁY TÍNH PYTHON ===")\n    print("1. Phép cộng")\n    print("2. Thoát")\n    luachon = input("Chọn chức năng: ")\n    if luachon == "2":\n        print("Tạm biệt!")\n        break\n    else:\n        a = float(input("Nhập số a: "))\n        b = float(input("Nhập số b: "))\n        print("Tổng là:", a + b)\n    print("\\n")`;

    const initialCode = localStorage.getItem('alpytide_py_code') !== null ? localStorage.getItem('alpytide_py_code') : defaultCode;

    const editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
      mode: 'python',
      theme: 'dracula',
      lineNumbers: true,
      lineWrapping: true,
      indentUnit: 4,
      autoCloseBrackets: true,
      inputStyle: 'textarea' // Giúp bàn phím điện thoại gõ tiếng Việt có dấu ổn định hơn
    });

    editor.setValue(initialCode);
    editor.on('change', () => {
      localStorage.setItem('alpytide_py_code', editor.getValue());
    });

    socket.on('connect', () => {
      document.getElementById('terminalText').innerText = "> Đã kết nối Server thành công!\n";
    });

    socket.on('output', (res) => {
      document.getElementById('loadingOverlay').style.display = 'none';
      const color = res.type === 'stderr' ? '#ff6b6b' : '#3fb950';
      appendOutput(res.data, color);
      
      if (res.data.includes(":") || res.data.includes("?")) {
        showInputBar(res.data.trim());
      }
    });

    socket.on('process_exit', (data) => {
      document.getElementById('loadingOverlay').style.display = 'none';
      appendOutput(`\n[Chương trình kết thúc]\n`, "#8b949e");
      hideInputBar();
      document.getElementById('runBtn').disabled = false;
    });

    function switchTab(tabName) {
      const editTab = document.getElementById('edit-tab');
      const outputTab = document.getElementById('output-tab');
      const editPane = document.getElementById('edit-pane');
      const outputPane = document.getElementById('output-pane');

      if (tabName === 'edit') {
        editTab.classList.add('active');
        outputTab.classList.remove('active');
        editPane.classList.add('show', 'active');
        outputPane.classList.remove('show', 'active');
        setTimeout(() => editor.refresh(), 50);
      } else {
        outputTab.classList.add('active');
        editTab.classList.remove('active');
        outputPane.classList.add('show', 'active');
        editPane.classList.remove('show', 'active');
      }
    }

    function appendOutput(text, color = "#3fb950") {
      const terminalText = document.getElementById('terminalText');
      const span = document.createElement('span');
      span.style.color = color;
      span.textContent = text;
      terminalText.appendChild(span);
      scrollToBottom();
    }

    function showInputBar(promptText) {
      const bar = document.getElementById('floatingInputBar');
      const inputEl = document.getElementById('terminalInput');
      const label = document.getElementById('inputPromptLabel');
      const popupText = document.getElementById('popupText');
      
      const cleanText = promptText || "Nhập:";
      label.textContent = cleanText;
      popupText.textContent = cleanText;
      
      bar.classList.add('show');
      inputEl.value = "";
      scrollToBottom();
    }

    function togglePopup() {
      const popup = document.getElementById('promptPopup');
      popup.classList.toggle('show');
    }

    document.getElementById('floatingInputBar').addEventListener('click', function(e) {
      if(e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && !e.target.classList.contains('label-container')) {
        document.getElementById('terminalInput').focus();
      }
    });

    function hideInputBar() {
      document.getElementById('floatingInputBar').classList.remove('show');
      document.getElementById('promptPopup').classList.remove('show');
    }

    function sendInput() {
      const inputEl = document.getElementById('terminalInput');
      const val = inputEl.value;
      hideInputBar();
      appendOutput(val + "\n", "#ffffff");
      socket.emit('input_data', val);
    }

    document.getElementById('terminalInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        sendInput();
      }
    });

    function scrollToBottom() {
      const terminal = document.getElementById('terminal');
      terminal.scrollTop = terminal.scrollHeight;
    }

    function runPythonCode() {
      switchTab('output');
      const terminalText = document.getElementById('terminalText');
      const loadingOverlay = document.getElementById('loadingOverlay');
      const runBtn = document.getElementById('runBtn');

      terminalText.innerHTML = "";
      hideInputBar();
      
      loadingOverlay.style.display = 'flex';
      runBtn.disabled = true;

      socket.emit('run_code', editor.getValue());
    }

    function clearCode() {
      if (confirm("Xóa toàn bộ code?")) {
        editor.setValue("");
        localStorage.removeItem('alpytide_py_code');
      }
    }

    function clearOutput() {
      document.getElementById('terminalText').innerHTML = "";
      hideInputBar();
    }

    function copyCode() {
      navigator.clipboard.writeText(editor.getValue());
      alert("Đã sao chép code!");
    }

    function copyLog() {
      navigator.clipboard.writeText(document.getElementById('terminalText').innerText);
      alert("Đã sao chép Output!");
    }
  </script>
</body>
</html>
