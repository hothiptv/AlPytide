<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlPytide IDE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/pyodide@0.26.2/pyodide.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    .CodeMirror { height: 350px; border-radius: 8px; font-size: 15px; }
    #output { background-color: #1e293b; color: #38bdf8; min-height: 120px; font-family: monospace; border-radius: 8px; padding: 12px; white-space: pre-wrap; }
  </style>
</head>
<body class="p-4">
  <div class="container max-w-4xl">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="fw-bold text-warning m-0">⚡ AlPytide IDE</h3>
      <a href="/docs" class="btn btn-outline-info btn-sm">Tài liệu API</a>
    </div>

    <div class="mb-3">
      <textarea id="editor"></textarea>
    </div>

    <div class="d-flex gap-2 mb-3">
      <button id="run-btn" class="btn btn-success fw-bold px-4" disabled>
        ⏳ Đang khởi tạo Python...
      </button>
      <button onclick="clearOutput()" class="btn btn-outline-secondary">Xóa Output</button>
    </div>

    <div>
      <label class="form-label text-secondary fw-semibold">Kết quả (Console Output):</label>
      <div id="output">Đang tải môi trường Python WebAssembly...</div>
    </div>
  </div>

  <script>
    let editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
      mode: 'python',
      theme: 'dracula',
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false,
      electricChars: true,
      extraKeys: {
        "Enter": function(cm) {
          let cursor = cm.getCursor();
          let line = cm.getLine(cursor.line);
          cm.replaceSelection("\n", "end");
          if (line.trim().endsWith(":")) {
            cm.indentLine(cursor.line + 1, "add");
          } else {
            cm.indentLine(cursor.line + 1, "smart");
          }
        }
      }
    });

    editor.setValue(`def chao_mung(ten):\n    print(f"Xin chào {ten} từ AlPytide API!")\n\nfor i in range(3):\n    chao_mung(f"User {i+1}")`);

    let pyodide;
    const outputEl = document.getElementById('output');
    const runBtn = document.getElementById('run-btn');

    async function initPyodide() {
      pyodide = await loadPyodide({
        stdout: (text) => { outputEl.innerText += text + "\n"; },
        stderr: (text) => { outputEl.innerText += "[Lỗi] " + text + "\n"; }
      });
      outputEl.innerText = "Sẵn sàng chạy Python!";
      runBtn.innerText = "▶ Chạy Code";
      runBtn.classList.remove('btn-success');
      runBtn.classList.add('btn-primary');
      runBtn.disabled = false;
    }
    initPyodide();

    runBtn.addEventListener('click', async () => {
      outputEl.innerText = "";
      try {
        await pyodide.runPythonAsync(editor.getValue());
      } catch (err) {
        outputEl.innerText = err.message;
      }
    });

    function clearOutput() {
      outputEl.innerText = "";
    }
  </script>
</body>
</html>
