<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AlPytide IDE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: monospace;
      user-select: none;
      touch-action: manipulation;
    }
    .brand-title {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .editor-container {
      display: flex;
      height: calc(100vh - 110px);
      border: 1px solid #333;
      border-radius: 4px;
      background: #1e1e1e;
      overflow: hidden;
    }
    .line-numbers {
      width: 40px;
      background-color: #252526;
      color: #858585;
      text-align: right;
      padding: 10px 8px;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.5;
      overflow: hidden;
      white-space: pre;
    }
    textarea.code-editor {
      flex: 1;
      background: transparent;
      color: #d4d4d4;
      border: none;
      outline: none;
      padding: 10px;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .console-output {
      height: calc(100vh - 110px);
      background-color: #000;
      color: #00ff66;
      padding: 15px;
      font-family: monospace;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-y: auto;
      border: 1px solid #333;
      border-radius: 4px;
    }
    .nav-tabs .nav-link {
      color: #aaa;
      border: none;
      padding: 6px 12px;
    }
    .nav-tabs .nav-link.active {
      background-color: #1e1e1e;
      color: #fff;
      border-bottom: 2px solid #0d6efd;
    }
  </style>
</head>
<body class="p-2">

  <div class="brand-title text-center">AlPytide Studio</div>

  <div class="d-flex justify-content-between align-items-center mb-2">
    <ul class="nav nav-tabs border-0" id="ideTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="edit-tab" data-bs-toggle="tab" data-bs-target="#edit-pane" type="button">main.py</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="output-tab" data-bs-toggle="tab" data-bs-target="#output-pane" type="button">Output</button>
      </li>
    </ul>

    <div class="d-flex align-items-center gap-1">
      <button class="btn btn-success btn-sm px-3 fw-bold" onclick="runPythonCode()">▶ Run</button>

      <div class="dropdown">
        <button class="btn btn-secondary btn-sm" type="button" data-bs-toggle="dropdown">
          ☰
        </button>
        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
          <li><a class="dropdown-item" href="#" onclick="copyCode()">Sao chép Edit Code</a></li>
          <li><a class="dropdown-item" href="#" onclick="copyLog()">Sao chép Console Log</a></li>
        </ul>
      </div>
    </div>
  </div>

  <div class="tab-content" id="ideTabContent">
    <div class="tab-pane fade show active" id="edit-pane" role="tabpanel">
      <div class="editor-container">
        <div class="line-numbers" id="lineNumbers">1</div>
        <textarea class="code-editor" id="codeEditor" spellcheck="false" placeholder="# Nhập mã Python ở đây..."></textarea>
      </div>
    </div>

    <div class="tab-pane fade" id="output-pane" role="tabpanel">
      <div class="console-output" id="consoleOutput">> Đang chờ thực thi...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
  <script>
    // Tự động nhận diện host (tránh lỗi lệch domain/protocol)
    const SERVER_URL = window.location.origin + '/api/run';

    const codeEditor = document.getElementById('codeEditor');
    const lineNumbers = document.getElementById('lineNumbers');
    const consoleOutput = document.getElementById('consoleOutput');

    const savedCode = localStorage.getItem('alpytide_code');
    if (savedCode) {
      codeEditor.value = savedCode;
    } else {
      codeEditor.value = `import requests\n\nprint("Xin chào từ AlPytide IDE!")`;
    }

    function updateLineNumbers() {
      const lines = codeEditor.value.split('\n').length;
      let lineNumHTML = '';
      for (let i = 1; i <= lines; i++) {
        lineNumHTML += i + '\n';
      }
      lineNumbers.textContent = lineNumHTML;
    }

    codeEditor.addEventListener('input', () => {
      updateLineNumbers();
      localStorage.setItem('alpytide_code', codeEditor.value);
    });

    codeEditor.addEventListener('scroll', () => {
      lineNumbers.scrollTop = codeEditor.scrollTop;
    });

    async function runPythonCode() {
      const code = codeEditor.value;
      consoleOutput.textContent = "> Đang kết nối server và thực thi code...";

      const outputTabTrigger = new bootstrap.Tab(document.getElementById('output-tab'));
      outputTabTrigger.show();

      try {
        const response = await fetch(SERVER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });

        const data = await response.json();
        consoleOutput.textContent = data.output;
      } catch (err) {
        consoleOutput.textContent = "> Lỗi kết nối Server: " + err.message;
      }
    }

    function copyCode() {
      navigator.clipboard.writeText(codeEditor.value);
      alert("Đã sao chép mã Python!");
    }

    function copyLog() {
      navigator.clipboard.writeText(consoleOutput.textContent);
      alert("Đã sao chép Console Log!");
    }

    updateLineNumbers();
  </script>
</body>
</html>
