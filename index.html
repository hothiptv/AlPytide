<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AlPytide IDE - Lua Engine</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- CodeMirror CSS & Themes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

  <style>
    body {
      background-color: #181a1f;
      color: #abb2bf;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 8px;
    }
    .brand-title {
      font-size: 0.7rem;
      color: #5c6370;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: bold;
    }
    .CodeMirror {
      height: calc(100vh - 110px) !important;
      font-family: "Fira Code", monospace, "Courier New";
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #282c34;
    }
    .console-output {
      height: calc(100vh - 110px);
      background-color: #0d1117;
      color: #3fb950;
      padding: 12px;
      font-family: "Fira Code", monospace;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-y: auto;
      border: 1px solid #30363d;
      border-radius: 6px;
    }
    .nav-tabs .nav-link {
      color: #8b949e;
      border: none;
      padding: 6px 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .nav-tabs .nav-link.active {
      background-color: #21262d;
      color: #58a6ff;
      border-bottom: 2px solid #58a6ff;
    }
  </style>
</head>
<body>

  <div class="brand-title text-center mb-1">ALPYTIDE STUDIO (LUA ENGINE)</div>

  <!-- Topbar -->
  <div class="d-flex justify-content-between align-items-center mb-2">
    <ul class="nav nav-tabs border-0" id="ideTabs">
      <li class="nav-item">
        <button class="nav-link active" id="edit-tab" onclick="switchTab('edit')">main.lua</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="output-tab" onclick="switchTab('output')">Output</button>
      </li>
    </ul>

    <div class="d-flex align-items-center gap-1">
      <button class="btn btn-primary btn-sm px-3 fw-bold" id="runBtn" onclick="runLuaCode()">▶ Run</button>

      <div class="dropdown">
        <button class="btn btn-outline-secondary btn-sm" type="button" id="menuBtn" data-bs-toggle="dropdown" aria-expanded="false">☰</button>
        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
          <li><a class="dropdown-item" href="javascript:void(0)" onclick="copyCode()">Sao chép Edit Code</a></li>
          <li><a class="dropdown-item" href="javascript:void(0)" onclick="copyLog()">Sao chép Console Log</a></li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="tab-content" id="ideTabContent">
    <div class="tab-pane fade show active" id="edit-pane">
      <textarea id="codeEditor"></textarea>
    </div>

    <div class="tab-pane fade" id="output-pane">
      <div class="console-output" id="consoleOutput">> Đang chờ thực thi...</div>
    </div>
  </div>

  <!-- JS Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/lua/lua.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

  <script>
    const SERVER_URL = window.location.origin + '/api/run';

    // Đọc mã lưu từ LocalStorage
    const initialCode = localStorage.getItem('alpytide_lua_code') || `-- AlPytide IDE Lua Engine\nlocal function greet(name)\n    print("Xin chào " .. name .. " từ AlPytide Server!")\nend\n\ngreet("Trọng An")`;

    // Cấu hình CodeMirror
    const editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
      mode: 'lua',
      theme: 'dracula',
      lineNumbers: true,
      lineWrapping: true,
      indentUnit: 4,
      autoCloseBrackets: true
    });

    editor.setValue(initialCode);

    // Lưu mã liên tục khi gõ
    editor.on('change', () => {
      localStorage.setItem('alpytide_lua_code', editor.getValue());
    });

    // Hàm chuyển Tab thủ công (Khắc phục triệt để lỗi không chuyển được tab)
    function switchTab(tabName) {
      const editTab = document.getElementById('edit-tab');
      const outputTab = document.getElementById('output-tab');
      const editPane = document.getElementById('edit-pane');
      const outputPane = document.getElementById('output-pane');

      if (tabName === 'edit') {
        editTab.classList.add('active');
        outputTab.classList.remove('active');
        editPane.classList.add('show', 'active');
        outputPane.classList.remove('show', 'active');
        setTimeout(() => editor.refresh(), 50); // Refresh lại CodeMirror khi quay về tab edit
      } else {
        outputTab.classList.add('active');
        editTab.classList.remove('active');
        outputPane.classList.add('show', 'active');
        editPane.classList.remove('show', 'active');
      }
    }

    // Thực thi mã Lua với AbortController (Tránh bị ngâm / lag quá lâu)
    async function runLuaCode() {
      const code = editor.getValue();
      const consoleOutput = document.getElementById('consoleOutput');
      const runBtn = document.getElementById('runBtn');

      // 1. Xóa toàn bộ output cũ trước khi in mới
      consoleOutput.textContent = "";

      runBtn.disabled = true;
      runBtn.innerText = '⏳ Running...';

      // 2. Chuyển sang Tab Output ngay lập tức
      switchTab('output');

      // Thiết lập giới hạn thời gian phản hồi ở Client là 6 giây
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 6000);

      try {
        const response = await fetch(SERVER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        const data = await response.json();
        consoleOutput.textContent = data.output;
      } catch (err) {
        if (err.name === 'AbortError') {
          consoleOutput.textContent = "> Lỗi: Server phản hồi quá lâu (Quá thời hạn 6 giây)!";
        } else {
          consoleOutput.textContent = "> Lỗi kết nối Server: " + err.message;
        }
      } finally {
        runBtn.disabled = false;
        runBtn.innerText = '▶ Run';
      }
    }

    function copyCode() {
      navigator.clipboard.writeText(editor.getValue());
      alert("Đã sao chép mã Lua!");
    }

    function copyLog() {
      const consoleOutput = document.getElementById('consoleOutput');
      navigator.clipboard.writeText(consoleOutput.textContent);
      alert("Đã sao chép Console Log!");
    }
  </script>
</body>
</html>
