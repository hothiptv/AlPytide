<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>AlPytide IDE - Python Engine</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

  <style>
    /* Chặn bôi đen và thao tác thu phóng trên toàn bộ trang */
    * { 
      box-sizing: border-box; 
      -webkit-user-select: none;
      user-select: none;
      touch-action: pan-x pan-y;
    }

    /* Cho phép bôi đen duy nhất ở khung Edit và Output */
    .CodeMirror, .console-output {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    body {
      background-color: #181a1f;
      color: #abb2bf;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 6px;
      overflow: hidden;
    }

    .brand-title {
      font-size: 0.65rem;
      color: #5c6370;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: bold;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .CodeMirror {
      height: calc(100vh - 85px) !important;
      font-family: "Fira Code", monospace, "Courier New";
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #282c34;
    }

    .console-output {
      height: calc(100vh - 85px);
      background-color: #0d1117;
      color: #3fb950;
      padding: 10px;
      font-family: "Fira Code", monospace;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-y: auto;
      border: 1px solid #30363d;
      border-radius: 6px;
    }

    .nav-tabs .nav-link {
      color: #8b949e;
      border: none;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .nav-tabs .nav-link.active {
      background-color: #21262d;
      color: #58a6ff;
      border-bottom: 2px solid #58a6ff;
    }

    .btn-action {
      height: 30px;
      min-width: 32px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="brand-title text-center mb-1">ALPYTIDE STUDIO (PYTHON ENGINE)</div>

  <div class="top-bar">
    <ul class="nav nav-tabs border-0" id="ideTabs">
      <li class="nav-item">
        <button class="nav-link active" id="edit-tab" onclick="switchTab('edit')">main.py</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="output-tab" onclick="switchTab('output')">Output</button>
      </li>
    </ul>

    <div class="d-flex align-items-center gap-1">
      <button class="btn btn-primary btn-action fw-bold" id="runBtn" onclick="runPythonCode()">
        <i class="fa-solid fa-play me-1"></i>Run
      </button>
      <button class="btn btn-outline-secondary btn-action" onclick="copyCode()" title="Sao chép Code">
        <i class="fa-regular fa-copy"></i>
      </button>
      <button class="btn btn-outline-secondary btn-action" onclick="copyLog()" title="Sao chép Console Output">
        <i class="fa-solid fa-terminal"></i>
      </button>
      <button class="btn btn-outline-secondary btn-action" onclick="clearOutput()" title="Xóa màn hình Output">
        <i class="fa-solid fa-broom"></i>
      </button>
      <button class="btn btn-outline-danger btn-action" onclick="clearCode()" title="Xóa tất cả code">
        <i class="fa-solid fa-trash-can"></i>
      </button>
    </div>
  </div>

  <div class="tab-content" id="ideTabContent">
    <div class="tab-pane fade show active" id="edit-pane">
      <textarea id="codeEditor"></textarea>
    </div>

    <div class="tab-pane fade" id="output-pane">
      <div class="console-output" id="consoleOutput">> Đang chờ thực thi...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

  <script>
    const SERVER_URL = '/api/run';

    const defaultCode = `name = input("Nhập tên của bạn: ")\nprint("Xin chào " + name + "!")`;
    const initialCode = localStorage.getItem('alpytide_py_code') !== null ? localStorage.getItem('alpytide_py_code') : defaultCode;

    const editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
      mode: 'python',
      theme: 'dracula',
      lineNumbers: true,
      lineWrapping: true,
      indentUnit: 4,
      autoCloseBrackets: true
    });

    editor.setValue(initialCode);

    editor.on('change', () => {
      localStorage.setItem('alpytide_py_code', editor.getValue());
    });

    function switchTab(tabName) {
      const editTab = document.getElementById('edit-tab');
      const outputTab = document.getElementById('output-tab');
      const editPane = document.getElementById('edit-pane');
      const outputPane = document.getElementById('output-pane');

      if (tabName === 'edit') {
        editTab.classList.add('active');
        outputTab.classList.remove('active');
        editPane.classList.add('show', 'active');
        outputPane.classList.remove('show', 'active');
        setTimeout(() => editor.refresh(), 50);
      } else {
        outputTab.classList.add('active');
        editTab.classList.remove('active');
        outputPane.classList.add('show', 'active');
        editPane.classList.remove('show', 'active');
      }
    }

    async function runPythonCode() {
      const code = editor.getValue();
      const consoleOutput = document.getElementById('consoleOutput');
      const runBtn = document.getElementById('runBtn');

      // Tự động tìm tất cả lệnh input() trong code để bật bàn phím nhập trước
      const inputRegex = /input\s*\(\s*(?:["'](.*?)["'])?\s*\)/g;
      let match;
      const userInputs = [];

      while ((match = inputRegex.exec(code)) !== null) {
        const promptText = match[1] || "Mời bạn nhập dữ liệu:";
        const val = prompt(promptText);
        userInputs.push(val !== null ? val : "");
      }

      consoleOutput.textContent = "";
      runBtn.disabled = true;
      runBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

      switchTab('output');

      try {
        const response = await fetch(SERVER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, inputs: userInputs })
        });

        const data = await response.json();
        consoleOutput.textContent = data.output;
      } catch (err) {
        consoleOutput.textContent = "> Lỗi kết nối Server: " + err.message;
      } finally {
        runBtn.disabled = false;
        runBtn.innerHTML = '<i class="fa-solid fa-play me-1"></i>Run';
      }
    }

    function clearCode() {
      if (confirm("Xóa toàn bộ code trong trình biên soạn?")) {
        editor.setValue("");
        localStorage.removeItem('alpytide_py_code');
      }
    }

    function clearOutput() {
      document.getElementById('consoleOutput').textContent = "> Đang chờ thực thi...";
    }

    function copyCode() {
      navigator.clipboard.writeText(editor.getValue());
      alert("Đã sao chép code Python!");
    }

    function copyLog() {
      const consoleOutput = document.getElementById('consoleOutput');
      navigator.clipboard.writeText(consoleOutput.textContent);
      alert("Đã sao chép Console Log!");
    }
  </script>
</body>
</html>
