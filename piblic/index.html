<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AlPytide Studio (Python Server Engine)</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

  <script src="/socket.io/socket.io.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
      -webkit-user-select: none;
      user-select: none;
    }

    .CodeMirror, #terminal {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    body {
      background-color: #181a1f;
      color: #abb2bf;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 6px;
      overflow: hidden;
    }

    .brand-title {
      font-size: 0.65rem;
      color: #5c6370;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: bold;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .CodeMirror {
      height: calc(100vh - 85px) !important;
      font-family: "Fira Code", monospace, "Courier New";
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #282c34;
    }

    .console-wrapper {
      position: relative;
      height: calc(100vh - 85px);
      background-color: #0d1117;
      color: #3fb950;
      padding: 10px;
      font-family: "Fira Code", monospace;
      font-size: 13px;
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Hiệu ứng Spinner Loading ở chính giữa console */
    .loading-overlay {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #58a6ff;
      z-index: 10;
    }

    .terminal-input-line {
      display: inline-flex;
      width: auto;
      min-width: 150px;
      align-items: center;
    }

    .terminal-input {
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: inherit;
      font-size: inherit;
      outline: none;
      padding: 0;
      margin: 0;
      caret-color: #3fb950;
    }

    .nav-tabs .nav-link {
      color: #8b949e;
      border: none;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 500;
    }

    .nav-tabs .nav-link.active {
      background-color: #21262d;
      color: #58a6ff;
      border-bottom: 2px solid #58a6ff;
    }

    .btn-action {
      height: 30px;
      min-width: 32px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="brand-title text-center mb-1">ALPYTIDE STUDIO (PYTHON ENGINE)</div>

  <div class="top-bar">
    <ul class="nav nav-tabs border-0" id="ideTabs">
      <li class="nav-item">
        <button class="nav-link active" id="edit-tab" onclick="switchTab('edit')">main.py</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="output-tab" onclick="switchTab('output')">Output</button>
      </li>
    </ul>

    <div class="d-flex align-items-center gap-1">
      <button class="btn btn-primary btn-action fw-bold" id="runBtn" onclick="runPythonCode()">
        <i class="fa-solid fa-play me-1"></i>Run
      </button>
      <button class="btn btn-outline-secondary btn-action" onclick="copyCode()" title="Sao chép Code">
        <i class="fa-regular fa-copy"></i>
      </button>
      <button class="btn btn-outline-secondary btn-action" onclick="copyLog()" title="Sao chép Console Output">
        <i class="fa-solid fa-terminal"></i>
      </button>
      <button class="btn btn-outline-secondary btn-action" onclick="clearOutput()" title="Xóa màn hình Output">
        <i class="fa-solid fa-broom"></i>
      </button>
      <button class="btn btn-outline-danger btn-action" onclick="clearCode()" title="Xóa tất cả code">
        <i class="fa-solid fa-trash-can"></i>
      </button>
    </div>
  </div>

  <div class="tab-content" id="ideTabContent">
    <div class="tab-pane fade show active" id="edit-pane">
      <textarea id="codeEditor"></textarea>
    </div>

    <div class="tab-pane fade" id="output-pane">
      <div class="console-wrapper" id="terminal" onclick="focusTerminalInput()">
        <!-- Spinner Loading -->
        <div class="loading-overlay" id="loadingOverlay">
          <div class="spinner-border text-primary" role="status"></div>
          <span style="font-size: 12px;">Đang kết nối Server & tải code...</span>
        </div>
        <div id="terminalText">> Đang kết nối tới Server...</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

  <script>
    const socket = io();

    const defaultCode = `import time\n\ndef tinh_tong(a, b):\n    return a + b\n\ndef tinh_hieu(a, b):\n    return a - b\n\ndef tinh_tich(a, b):\n    return a * b\n\nwhile True:\n    print("=== SIÊU MÁY TÍNH SERVER ===")\n    print("--- MENU LỰA CHỌN ---")\n    print("1. Phép cộng")\n    print("2. Phép trừ")\n    print("3. Phép nhân")\n    print("4. Thoát")\n    luachon = input("Mời bạn chọn (1-4): ")\n    if luachon == "4":\n        print("Đang tắt Siêu máy tính... Tạm biệt!")\n        break\n    elif luachon in ["1", "2", "3"]:\n        a = float(input("Nhập số thứ nhất: "))\n        b = float(input("Nhập số thứ hai: "))\n        if luachon == "1":\n            print("Kết quả:", tinh_tong(a, b))\n        elif luachon == "2":\n            print("Kết quả:", tinh_hieu(a, b))\n        elif luachon == "3":\n            print("Kết quả:", tinh_tich(a, b))\n    print("\\n")`;

    const initialCode = localStorage.getItem('alpytide_py_code') !== null ? localStorage.getItem('alpytide_py_code') : defaultCode;

    const editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
      mode: 'python',
      theme: 'dracula',
      lineNumbers: true,
      lineWrapping: true,
      indentUnit: 4,
      autoCloseBrackets: true
    });

    editor.setValue(initialCode);
    editor.on('change', () => {
      localStorage.setItem('alpytide_py_code', editor.getValue());
    });

    socket.on('connect', () => {
      document.getElementById('terminalText').textContent = "> Đã kết nối tới Server Python thành công!\n";
    });

    socket.on('output', (res) => {
      // Khi nhận dữ liệu đầu tiên, ẩn spinner đi
      document.getElementById('loadingOverlay').style.display = 'none';
      const color = res.type === 'stderr' ? '#ff6b6b' : '#3fb950';
      appendOutput(res.data, color);
      ensureInputLine();
    });

    socket.on('process_exit', (data) => {
      document.getElementById('loadingOverlay').style.display = 'none';
      appendOutput(`\n[Tiến trình kết thúc với mã ${data.code}]\n`, "#8b949e");
      removeInputLine();
      document.getElementById('runBtn').disabled = false;
    });

    function switchTab(tabName) {
      const editTab = document.getElementById('edit-tab');
      const outputTab = document.getElementById('output-tab');
      const editPane = document.getElementById('edit-pane');
      const outputPane = document.getElementById('output-pane');

      if (tabName === 'edit') {
        editTab.classList.add('active');
        outputTab.classList.remove('active');
        editPane.classList.add('show', 'active');
        outputPane.classList.remove('show', 'active');
        setTimeout(() => editor.refresh(), 50);
      } else {
        outputTab.classList.add('active');
        editTab.classList.remove('active');
        outputPane.classList.add('show', 'active');
        editPane.classList.remove('show', 'active');
      }
    }

    function appendOutput(text, color = "#3fb950") {
      const terminalText = document.getElementById('terminalText');
      const span = document.createElement('span');
      span.style.color = color;
      span.textContent = text;
      terminalText.appendChild(span);
      scrollToBottom();
    }

    function ensureInputLine() {
      const terminalText = document.getElementById('terminalText');
      let inputEl = document.getElementById('activeInput');
      
      if (!inputEl) {
        const inputContainer = document.createElement('span');
        inputContainer.className = 'terminal-input-line';
        inputContainer.id = 'inputContainer';
        inputContainer.innerHTML = `<input type="text" id="activeInput" class="terminal-input" autofocus autocomplete="off" spellcheck="false">`;
        terminalText.appendChild(inputContainer);
        inputEl = document.getElementById('activeInput');

        inputEl.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            const val = inputEl.value;
            inputContainer.remove();
            appendOutput(val + "\n", "#ffffff");
            socket.emit('input_data', val);
          }
        });
      } else {
        terminalText.appendChild(document.getElementById('inputContainer'));
      }
      inputEl.focus();
      scrollToBottom();
    }

    function removeInputLine() {
      const el = document.getElementById('inputContainer');
      if (el) el.remove();
    }

    function focusTerminalInput() {
      const activeInput = document.getElementById('activeInput');
      if (activeInput) activeInput.focus();
    }

    function scrollToBottom() {
      const terminal = document.getElementById('terminal');
      terminal.scrollTop = terminal.scrollHeight;
    }

    function runPythonCode() {
      // 1. Trượt ngay sang tab Output
      switchTab('output');

      const terminalText = document.getElementById('terminalText');
      const loadingOverlay = document.getElementById('loadingOverlay');
      const runBtn = document.getElementById('runBtn');

      terminalText.innerHTML = "";
      
      // 2. Hiển thị vòng xoay Spinner Loading
      loadingOverlay.style.display = 'flex';
      runBtn.disabled = true;

      // 3. Gửi mã Python về Backend thực thi
      socket.emit('run_code', editor.getValue());
    }

    function clearCode() {
      if (confirm("Xóa toàn bộ code?")) {
        editor.setValue("");
        localStorage.removeItem('alpytide_py_code');
      }
    }

    function clearOutput() {
      document.getElementById('terminalText').innerHTML = "";
    }

    function copyCode() {
      navigator.clipboard.writeText(editor.getValue());
      alert("Đã sao chép code!");
    }

    function copyLog() {
      navigator.clipboard.writeText(document.getElementById('terminalText').innerText);
      alert("Đã sao chép Output!");
    }
  </script>
</body>
</html>
